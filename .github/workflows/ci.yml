name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NLayerShop.sln

      - name: Build
        run: dotnet build NLayerShop.sln --configuration Release --no-restore

      # Integration tests start a SQL Server container through Testcontainers;
      # Docker is preinstalled on ubuntu-latest runners.
      - name: Test
        run: dotnet test NLayerShop.sln --configuration Release --no-build --verbosity normal
